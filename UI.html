<html>
    <head>
        <Title>RTU PORTAL V2</Title>
         <link rel = "stylesheet" href = "Style.css"> 
        <script src = "work.js" defer></script>
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    </head>
    <body>
        <h1><img id = "logo" src="Logo.png" width="60" height="60" alt="RTU Logo">
     RTU PORTAL </h1>
        <h3>Student Services</h3>
        <br>
        <br>
        <p>STUDENT SPACE</p>
        <button id= "overview" class = "hov" type= button><span class="material-icons">home</span>Overview</button> <br>
        <button id= "csched" class = "hov" type= button><span class="material-icons">schedule</span>Class Schedule</button> <br>
        <button id= "acadrec" class = "hov" type= button><span class="material-icons">list</span>Academic Record</button> <br>
        <button id= "curriculum" class = "hov" type= button><span class="material-icons">note</span>Curriculum</button> <br>

        <p>ENROLLMENT & SERVICES</p>
        <button id= "enroll" class = "hov" type= button><span class="material-icons">assignment</span>Enrollment</button> <br>
        <button id= "teaval" class = "hov" type= button><span class="material-icons">person</span>Teacher Evaluation</button> <br>
        <button id= "applygrad" class = "hov" type= button><span class="material-icons">school</span>Apply Graduation</button> <br>

        <p>CAMPUS LIFE</p>
        <button id= "calendar" class = "hov" type= button><span class="material-icons">today</span>Calendar</button> <br>
        <button id= "notif" class = "hov" type= button><span class="material-icons">doorbell</span>Notifications</button> <br>

        <p>MY ACCOUNT</p>
        <button id= "profile" class = "hov" type= button><span class="material-icons">manage_accounts</span>My Profile</button> <br>
        <button id= "acctsec" class = "hov" type= button><span class="material-icons">security</span>Account Security</button> <br>

        
    </body>
</html>
